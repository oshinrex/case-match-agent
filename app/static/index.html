<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Match</title>
<style>
  /* Self-hosted so the brand fonts render regardless of network policy
     (corporate proxies and ad/privacy blockers routinely block Google's
     font CDN) - both are variable fonts, one file covers every weight. */
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('/static/fonts/inter-latin-var.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 500 700;
    font-display: swap;
    src: url('/static/fonts/space-grotesk-latin-var.woff2') format('woff2');
  }
  :root {
    --bg: #ffffff;
    --text: #1f2328;
    --muted: #5b6570;
    --border: #d7dbe0;
    --accent: #1a7f37;
    --accent-dark: #14602a;
    --accent-bg: #e9f6ec;
    --line: #e4e7eb;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --font-display: 'Space Grotesk', var(--font-ui);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 var(--font-ui);
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* faint graph-paper backdrop, nodding to the product without shouting about it */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 38%, #000 0%, transparent 72%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 38%, #000 0%, transparent 72%);
  }

  .stage {
    position: relative; z-index: 1;
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 64px 24px;
  }

  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--accent-dark);
    background: var(--accent-bg); border: 1px solid var(--accent);
    padding: 5px 14px; border-radius: 20px; letter-spacing: .02em;
    margin-bottom: 28px;
  }
  .kicker .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }

  .wordmark {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(48px, 9vw, 92px);
    letter-spacing: -0.03em;
    margin: 0;
    line-height: 1.02;
  }
  .wordmark .accent { color: var(--accent); }

  .tagline {
    max-width: 560px;
    margin: 22px 0 40px;
    font-size: 19px;
    line-height: 1.6;
    color: var(--muted);
  }

  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--accent); color: #fff; text-decoration: none;
    font: 700 17px var(--font-ui); letter-spacing: 0.01em;
    padding: 16px 34px; border-radius: 4px; border: 1px solid var(--accent-dark);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow: 0 1px 2px rgba(20, 96, 42, 0.08);
  }
  .cta:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(20, 96, 42, 0.22);
  }
  .cta:active { transform: translateY(0); }
  .cta svg { transition: transform .15s ease; }
  .cta:hover svg { transform: translateX(3px); }

  .features {
    display: flex; gap: 28px; flex-wrap: wrap; justify-content: center;
    margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--border);
    width: 100%; max-width: 640px;
  }
  .feature { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); font-weight: 500; }
  .feature .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 24px; font-size: 13px; color: var(--muted);
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="stage">
  <span class="kicker"><span class="dot"></span>Institutional memory for consulting teams</span>

  <h1 class="wordmark">Case<span class="accent">Match</span></h1>

  <p class="tagline">
    Find the right past engagement for any new client situation, and grow a
    living library of your firm's work as you go.
  </p>

  <a class="cta" href="/app">
    View demo
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3.5 8H12.5M12.5 8L8.5 4M12.5 8L8.5 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <div class="features">
    <div class="feature"><span class="dot"></span>Precedent search</div>
    <div class="feature"><span class="dot"></span>PDF case intake</div>
    <div class="feature"><span class="dot"></span>Growing case library</div>
  </div>
</div>

<footer>Case Match</footer>

</body>
</html>
